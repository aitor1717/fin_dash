# Fully synthetic demo book (see pipeline/generate_sample_feed.py) -- no real
# trade history, safe to publish. Real, liquid tickers so yfinance resolves
# benchmark/compliance data normally; every trade's timing and return is
# generated from an invented-but-plausible distribution, not derived from
# any real account.

feed_path: feed/sample_feed.csv
timezone: America/New_York

# This book will never get new trades -- pin "today" to the last real
# activity the feed has instead of real wall-clock time, so the benchmark
# range, mark-to-market, and "today" chart stay reproducible instead of
# drifting forward (and eventually looking broken/empty) every day this
# gets rebuilt after the feed itself stops changing.
freeze_asof: true

account_size: 40000
position_weight_pct: 1.5

benchmarks:
  - SPY
  - QQQ
  - DIA

compliance:
  profit_target_pct: 15.0
  max_loss_pct: 7.0
  concentration_band_pct: [30.0, 50.0]
  min_share_price: 0.10
  min_avg_volume: 500000

output_dir: docs/data-sample

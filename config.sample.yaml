# Fully synthetic demo book (see pipeline/generate_sample_feed.py). No
# real trade history; safe to publish. Real, liquid tickers, so yfinance
# resolves benchmark/compliance data normally. Every trade's timing and
# return comes from an invented-but-plausible distribution, not from any
# real account.

feed_path: feed/sample_feed.csv
timezone: America/New_York

# This book will never get new trades. Pin "today" to the feed's last
# real activity, not real wall-clock time, so the benchmark range,
# mark-to-market, and "today" chart stay reproducible on every rebuild.
freeze_asof: true

account_size: 40000
position_weight_pct: 1.5

benchmarks:
  - SPY
  - QQQ
  - DIA

compliance:
  profit_target_pct: 15.0
  max_loss_pct: 7.0
  concentration_band_pct: [30.0, 50.0]
  min_share_price: 0.10
  min_avg_volume: 500000

output_dir: docs/data-sample
